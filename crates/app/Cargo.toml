[package]
name = "vault-wallpaper"
version = "1.0.0-beta.1"
edition = "2024"

[features]
# Sparkle 2 automatic updates for the direct-download build (DMG, Homebrew).
# packaging/build-app.sh turns it on; the Mac App Store build must leave it off.
updater = ["objc2-foundation/NSBundle", "objc2-foundation/NSDictionary", "objc2-foundation/NSError", "objc2-foundation/NSString"]

[dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSValue"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGDataProvider"] }
objc2-io-surface = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes", "objc2-io-surface"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "CAAnimation", "CAMediaTiming", "CAMediaTimingFunction", "CAFrameRateRange", "CATransaction", "objc2-core-foundation"] }
objc2-service-management = "0.3"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde_json = "1.0.154"
tray-icon = "0.26.1"
vw-core = { version = "0.1.0", path = "../core" }
vw-render = { version = "0.1.0", path = "../render" }
wgpu = "30.0.1"
winit = "0.30.13"
wry = { version = "0.57.1", default-features = false }

# Tests and clippy on macOS for pull requests, for both feature sets: the default (App Store)
# build and the direct build with the Sparkle updater.
#
# Cost: free on a public repo. On a private repo, macOS minutes count 10x against the free
# 2,000 minutes a month (GitHub Free), so about 200 real macOS minutes. One run is roughly
# 8-15 minutes (less with a warm cache), so about 15-25 runs a month. That's why this is
# one job (one runner start-up and one shared cache), only pull requests and merges to main,
# and why a new push cancels the run still going for the same PR.
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "obsidian-plugin/**"
  # Pushes to main run it too, only so the Rust cache gets saved (save-if below): PR runs
  # restore main's cache but never write one. On a private repo each such run also costs
  # minutes (docs/release-checklist.md, "Cost of CI").
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "obsidian-plugin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # packaging/notices.sh's generator; release.sh and release.yml pin the same version.
  CARGO_ABOUT_VERSION: 0.9.3

defaults:
  run:
    # Explicit bash runs with -eo pipefail.
    shell: bash

jobs:
  test:
    name: test + clippy (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned to a commit, so the toolchain has to be named (it isn't taken from the ref).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-08
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so PRs don't evict each other's (10 GB cap per repo).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Does the app have an updater feature?
        id: features
        run: |
          if awk '/^\[features\]/{f=1;next} /^\[/{f=0} f && /^updater[[:space:]]*=/{found=1} END{exit !found}' crates/app/Cargo.toml; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/app has no 'updater' feature yet; testing the default feature set only"
          fi

      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test (default features)
        run: cargo test --workspace --locked

      - name: clippy (updater)
        if: steps.features.outputs.updater == 'true'
        run: cargo clippy --workspace --all-targets --locked --features vault-wallpaper/updater -- -D warnings

      - name: test (updater)
        if: steps.features.outputs.updater == 'true'
        run: cargo test --workspace --locked --features vault-wallpaper/updater

      # cargo-about for packaging/notices.sh. Installed into ~/.cargo/bin, which rust-cache
      # saves, so a warm cache skips the build. Pinned: another version may word the notices
      # differently.
      - name: Install cargo-about
        run: |
          if [[ "$(cargo about --version 2>/dev/null)" != "cargo-about $CARGO_ABOUT_VERSION" ]]; then
            cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli
          fi
          cargo about --version

      # THIRD-PARTY-NOTICES.txt must match Cargo.lock. notices.sh runs cargo-about --offline,
      # so fetch every crate in the lock file first (all platforms; a build fetches only macOS's).
      - name: Licence notices are up to date
        run: |
          cargo fetch --locked
          packaging/notices.sh --check
